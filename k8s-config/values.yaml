app:
  name: trade-engine
  image:
    repository: longtran112/trade-engine
    tag: v1
    pullPolicy: Always

deployment:
  replicas: 1
  namespace: default
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  name: trade-engine-service
  type: NodePort # switch to ClusterIP if using ingress
  port: 8080
  targetPort: 8080
  nodePort: 30080

servicemonitor:
  enabled: true
  name: trade-engine-monitor
  namespace: monitoring # where prometheus lives
  release: main-monitoring
  path: /actuator/prometheus
  interval: 15s
  namespaceSelector:
    - default

ingress:
  enabled: true # flip to true when ready
  className: nginx # or "traefik" if on K3s

  rateLimit:
    enabled: true
    rps: "10" # 10 req/sec per IP seems reasonable
    rpm: "100"
    connections: "10"
    burst: "20" # allow some burst traffic
    whitelist: "" # add trusted IPs here if needed

  hosts:
    - host: trade-engine.example.com # update this
      paths:
        - path: /
          pathType: Prefix

  tls: false
  tlsSecretName: trade-engine-tls
  sslRedirect: true

  # extra nginx stuff if you need it
  nginxConfig: {}
  # nginxConfig:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
