app:
  name: trade-engine
  image:
    repository: longtran112/trade-engine
    tag: v1
    pullPolicy: Always

deployment:
  replicas: 1
  namespace: default
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  name: trade-engine-service
  type: ClusterIP # Use ClusterIP when ingress is enabled (more secure)
  port: 8080
  targetPort: 8080
  # nodePort not needed with ClusterIP
  # nodePort: 30080

servicemonitor:
  enabled: true
  name: trade-engine-monitor
  namespace: monitoring # where prometheus lives
  release: main-monitoring
  path: /actuator/prometheus
  interval: 15s
  namespaceSelector:
    - default

ingress:
  enabled: true # flip to true when ready
  className: nginx # or "traefik" if on K3s

  rateLimit:
    enabled: true
    rps: "2" # 2 req/sec per IP (very restrictive - easy to trigger)
    rpm: "20" # 20 req/min per IP
    connections: "3" # 3 concurrent connections per IP
    burst: "5" # small burst allowance
    whitelist: "" # add trusted IPs here if needed

  hosts:
    - host: trade-engine.example.com # specific hostname
      paths:
        - path: /
          pathType: Prefix
    - host: "*" # default catch-all (works with IP access)
      paths:
        - path: /
          pathType: Prefix

  tls: false
  tlsSecretName: trade-engine-tls
  sslRedirect: true

  # extra nginx stuff if you need it
  nginxConfig: {}
  # nginxConfig:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
