apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-managed
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.x # or specific version like 7.6.0
    helm:
      releaseName: argocd
      valueFiles:
        - $values/github.com/LongTran112/c7-clearing-project/argocd-config/values.yaml
      # Alternative: use values from Git via external values
      # This requires ArgoCD to have access to your Git repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
