app:
  name: trade-engine
  image:
    repository: longtran112/trade-engine
    tag: v1
    pullPolicy: Always

deployment:
  replicas: 1
  namespace: default
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

service:
  name: trade-engine-service
  type: ClusterIP
  port: 8080
  targetPort: 8080

servicemonitor:
  enabled: true
  name: trade-engine-monitor
  namespace: monitoring
  release: main-monitoring
  path: /actuator/prometheus
  interval: 15s
  namespaceSelector:
    - default

ingress:
  enabled: true
  className: nginx

  rateLimit:
    enabled: true
    rps: "2"
    rpm: "20"
    connections: "3"
    burst: "5"
    whitelist: ""

  hosts:
    - host: trade-engine.example.com
      paths:
        - path: /
          pathType: Prefix
    # Remove the "*" catch-all for security in production
    - host: "*"
      paths:
        - path: /
          pathType: Prefix

  tls: false
  tlsSecretName: trade-engine-tls
  sslRedirect: true

  nginxConfig: {}

secret:
  name: my-app-secret
